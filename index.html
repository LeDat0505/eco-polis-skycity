<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Eco-Polis 3D</title>
<meta name="description" content="Eco-Polis: The Zenith Metropolis, a floating sky city in 3D. Group 5, THPT Lê Quý Đôn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A0F1E;
    --panel: rgba(10, 15, 30, 0.72);
    --pearl: #F4F1EA;
    --cyan: #00E5FF;
    --aether: #3FA9F5;
    --muted: #9fb3c8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--navy); color: var(--pearl); font-family: "Exo 2", system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .hud { position: fixed; pointer-events: none; z-index: 2; text-shadow: 0 1px 3px rgba(5, 10, 25, .85), 0 0 12px rgba(5, 10, 25, .6); }
  .shade { position: fixed; left: 0; right: 0; height: 160px; pointer-events: none; z-index: 1; }
  .shade.top { top: 0; background: linear-gradient(rgba(10, 15, 30, .7), transparent); }
  .shade.bottom { bottom: 0; background: linear-gradient(transparent, rgba(10, 15, 30, .75)); }
  .brand { top: 16px; left: 16px; }
  .brand .tag { font-size: 11px; letter-spacing: .3em; color: var(--cyan); }
  .brand h1 { margin: 4px 0 0; font-weight: 300; font-size: clamp(28px, 6vw, 48px); letter-spacing: .18em; line-height: 1; text-shadow: 0 0 18px rgba(0, 229, 255, .45); }
  .brand p { margin: 6px 0 0; font-size: clamp(12px, 2.6vw, 15px); color: var(--aether); letter-spacing: .08em; }

  .credit { bottom: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; font-size: 11px; color: var(--muted); letter-spacing: .05em; }
  .credit b { color: var(--pearl); font-weight: 500; }
  .hint { text-align: right; }

  .card {
    position: fixed; z-index: 3; right: 16px; top: 16px; width: min(320px, calc(100vw - 32px));
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(0, 229, 255, .35); border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 0 24px rgba(0, 229, 255, .15); display: none;
  }
  .card.show { display: block; }
  .card .label { font-size: 10px; letter-spacing: .3em; color: var(--cyan); }
  .card h2 { margin: 4px 0 8px; font-size: 18px; font-weight: 500; }
  .card dl { margin: 0; font-size: 13px; line-height: 1.45; }
  .card dt { color: var(--aether); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-top: 6px; }
  .card dd { margin: 0; }
  .card button { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }

  .loader { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; background: var(--navy); transition: opacity .6s; }
  .loader.done { opacity: 0; pointer-events: none; }
  .loader .box { width: min(280px, 80vw); text-align: center; }
  .loader .title { letter-spacing: .3em; font-weight: 300; font-size: 22px; }
  .bar { margin-top: 14px; height: 2px; background: rgba(255, 255, 255, .1); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); transition: width .2s; }
  .loader small { display: block; margin-top: 8px; color: var(--muted); font-size: 11px; letter-spacing: .15em; }

  @media (max-width: 600px) {
    .card { top: auto; bottom: 56px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div class="shade top"></div>
<div class="shade bottom"></div>

<div class="hud brand">
  <div class="tag">SECTOR 00 / ORIGIN</div>
  <h1>ECO-POLIS</h1>
  <p>The Zenith Metropolis</p>
</div>

<div class="hud credit">
  <div><b>Group 5</b> · THPT Lê Quý Đôn<br>Lê Thiên Đạt · Hoàng Nguyên · Xuân Hải · Nhật Minh · Minh Khang</div>
  <div class="hint">Drag to rotate · Scroll to zoom<br>Tap a building to learn more</div>
</div>

<div class="card" id="card">
  <button id="close" aria-label="Close">×</button>
  <div class="label">STRUCTURE</div>
  <h2 id="c-name"></h2>
  <dl>
    <dt>Purpose</dt><dd id="c-purpose"></dd>
    <dt>Feature</dt><dd id="c-feature"></dd>
  </dl>
</div>

<div class="loader" id="loader">
  <div class="box">
    <div class="title">ECO-POLIS</div>
    <div class="bar"><i id="bar"></i></div>
    <small id="status">INITIALIZING CITY…</small>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const container = document.getElementById('scene');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9ec9ef, 90, 220);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 1000);
camera.position.set(52, 40, 52);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 13, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 10;
controls.maxDistance = 140;
controls.maxPolarAngle = Math.PI * 0.62;
controls.addEventListener('start', () => { controls.autoRotate = false; });

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
scene.add(new THREE.HemisphereLight(0xdff3ff, 0x5a6b80, 0.9));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.6);
sun.position.set(30, 60, 20);
scene.add(sun);

// Sky dome: deep blue overhead fading to pale horizon
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(500, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x1d4f9c) }, mid: { value: new THREE.Color(0x7fb8ec) }, low: { value: new THREE.Color(0xdbeeff) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 low; varying vec3 vP; void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.6)) : mix(mid, low, min(-h * 3.0, 1.0)); gl_FragColor = vec4(c, 1.0); }'
  })
);
scene.add(sky);

// Sea of clouds below the islands
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
const puff = new THREE.IcosahedronGeometry(1, 2);
const clouds = new THREE.Group();
for (let i = 0; i < 60; i++) {
  const r = 30 + Math.random() * 110, a = Math.random() * Math.PI * 2;
  const cloud = new THREE.Group();
  for (let j = 0; j < 5; j++) {
    const m = new THREE.Mesh(puff, cloudMat);
    const s = 3 + Math.random() * 5;
    m.scale.set(s * 1.6, s * 0.7, s);
    m.position.set((Math.random() - 0.5) * 12, Math.random() * 2, (Math.random() - 0.5) * 8);
    cloud.add(m);
  }
  cloud.position.set(Math.cos(a) * r, -16 + Math.random() * 6, Math.sin(a) * r);
  clouds.add(cloud);
}
scene.add(clouds);

// Glow around the Eco Crystal Core
const coreLight = new THREE.PointLight(0x00e5ff, 40, 30, 1.6);
coreLight.position.set(-0.7, 22, -0.7);
scene.add(coreLight);

// Re-centre a model on X/Z and sit it on its base, and soften metal that renders black without an environment map
function prepareModel(model) {
  model.traverse(child => {
    if (!child.isMesh) return;
    for (const mat of [].concat(child.material)) {
      if (mat.metalness > 0.3) { mat.metalness = 0.1; mat.roughness = Math.max(mat.roughness || 0.5, 0.6); }
    }
  });
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3());
  const offset = new THREE.Vector3(c.x, box.min.y, c.z);
  if (offset.lengthSq() > 0.001) model.children.forEach(ch => ch.position.sub(offset));
}

const loader = new GLTFLoader();
const templates = new Map();
const failed = window.failedModels = [];
function loadTemplate(path) {
  if (!templates.has(path)) {
    // Retry flaky connections, and give up on a model after 20 s so one bad file never blocks the city
    const attempt = n => Promise.race([
      loader.loadAsync('./models/' + path),
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 20000))
    ]).catch(err => n > 0 ? attempt(n - 1) : Promise.reject(err));
    templates.set(path, attempt(2).then(g => { prepareModel(g.scene); return g.scene; }).catch(() => { failed.push(path); return null; }));
  }
  return templates.get(path);
}

const city = new THREE.Group();
scene.add(city);
const bar = document.getElementById('bar');
const status = document.getElementById('status');

function place(obj, item) {
  const def = item.modelPath && item.modelPath.startsWith('nha/') ? 4.5 : 3.5;
  obj.position.set(item.x, item.y, item.z);
  obj.rotation.set(item.rotationX || 0, item.rotationY || 0, item.rotationZ || 0);
  obj.scale.set(item.scaleX || item.scale || def, item.scaleY || item.scale || def, item.scaleZ || item.scale || def);
}

async function build() {
  const data = await fetch('./Skycity.json').then(r => r.json());
  const items = data.objects || data;
  const leaves = [];
  (function collect(list) { for (const it of list) it.isGroup ? collect(it.items) : leaves.push(it); })(items);
  const paths = [...new Set(leaves.map(it => it.modelPath))];

  let done = 0;
  await Promise.all(paths.map(p => loadTemplate(p).then(() => {
    done++;
    bar.style.width = (done / paths.length * 100) + '%';
    status.textContent = `LOADING MODULES ${done} / ${paths.length}`;
  })));

  async function add(list, parent) {
    for (const it of list) {
      if (it.isGroup) {
        const g = new THREE.Group();
        place(g, it);
        g.userData.details = it.details;
        parent.add(g);
        await add(it.items, g);
        continue;
      }
      const tpl = await loadTemplate(it.modelPath);
      if (!tpl) continue;
      const m = tpl.clone(true);
      place(m, it);
      m.userData.details = it.details;
      parent.add(m);
    }
  }
  await add(items, city);
  status.textContent = 'CITY ONLINE';
  setTimeout(() => document.getElementById('loader').classList.add('done'), 300);
}

// Tap or click a structure to show its details
const card = document.getElementById('card');
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(city, true)[0];
  let o = hit && hit.object;
  while (o && !(o.userData.details && o.userData.details.name)) o = o.parent;
  if (!o) { card.classList.remove('show'); return; }
  const d = o.userData.details;
  document.getElementById('c-name').textContent = d.name;
  document.getElementById('c-purpose').textContent = d.purpose || '—';
  document.getElementById('c-feature').textContent = d.feature || '—';
  card.classList.add('show');
});
document.getElementById('close').onclick = () => card.classList.remove('show');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  clouds.rotation.y = t * 0.004;
  coreLight.intensity = 34 + Math.sin(t * 2) * 8;
  controls.update();
  renderer.render(scene, camera);
});

build().catch(err => { status.textContent = 'FAILED TO LOAD CITY'; console.error(err); });
</script>
</body>
</html>
